spring.application.name=memorieshub

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:9090}


# =========================================================
# POSTGRESQL DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/memorieshub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/memorieshub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

cloudinary.cloud-name=${CLOUDINARY_NAME:du3jstjn}
cloudinary.api-key=${CLOUDINARY_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}

# =========================================================
# FRONTEND
# =========================================================
frontend.url=${FRONTEND_URL:https://momentspace-frontend.vercel.app}
# Multipart
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB



